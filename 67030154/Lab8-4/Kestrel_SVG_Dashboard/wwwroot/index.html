<!doctype html><html><head><meta charset="utf-8"><title>67030154 Edge Speedometer</title><style>body{margin:0;background:#0d1522;color:#eaf4ff;font:16px Segoe UI;text-align:center}.card{margin:8vh auto;padding:28px;max-width:560px;background:#1d2b40;border-radius:22px}svg{width:100%;max-width:470px}.value{font-size:42px;font-weight:700;fill:#fff}.muted{fill:#9bb0c9}</style></head><body><main class="card"><h1>IoT Edge Speedometer</h1><p>Student 67030154 • ESP32 Hardware Stream</p><svg viewBox="0 0 520 300"><path d="M80 230 A180 180 0 0 1 440 230" fill="none" stroke="#35e889" stroke-width="14" stroke-dasharray="225 340"/><path d="M305 68 A180 180 0 0 1 440 230" fill="none" stroke="#ff3d63" stroke-width="14" stroke-dasharray="95 340"/><text x="260" y="190" text-anchor="middle" class="value" id="pct">--%</text><text x="260" y="220" text-anchor="middle" class="muted" id="raw">waiting...</text></svg><p id="source">Connecting...</p></main><script>async function tick(){try{const d=await (await fetch('/api/telemetry')).json();pct.textContent=d.percentage+'%';raw.textContent=d.rawValue+' RAW • '+d.voltage+' V';source.textContent=d.alertLevel+' • '+d.dataSource}catch(e){source.textContent='Simulator / waiting for serial'}}setInterval(tick,500);tick();</script></body></html>
