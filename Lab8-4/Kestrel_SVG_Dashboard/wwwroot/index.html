<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 IoT Interactive Gateway Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(
                circle at center,
                #1b263b 0%,
                #0d1b2a 100%
            );

            color: #e0e1dd;
            font-family: 'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5);

            text-align: center;

            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #00f2fe;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #778da9;
            margin-bottom: 25px;
        }

        /* =========================
           Speedometer SVG
           ========================= */

        .gauge-svg {
            width: 100%;
            max-width: 320px;

            filter:
                drop-shadow(
                    0 0 15px rgba(0, 242, 254, 0.2)
                );
        }

        #needle {
            transform-origin: 150px 150px;

            transition:
                transform
                0.15s
                cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================
           VU Meter
           ========================= */

        .vu-container {
            margin-top: 20px;
        }

        .vu-title {
            font-size: 0.8rem;
            color: #778da9;
            margin-bottom: 8px;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #vumeter {
            width: 100%;
            max-width: 250px;

            filter:
                drop-shadow(
                    0 0 5px rgba(255, 255, 255, 0.1)
                );
        }

        .led {
            transition:
                opacity 0.15s ease,
                filter 0.15s ease;
        }

        /* =========================
           Statistics
           ========================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

            margin-top: 25px;
        }

        .stat-card {
            background:
                rgba(13, 27, 42, 0.6);

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 12px;

            padding: 12px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #778da9;
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: bold;

            color: #4cc9f0;

            margin-top: 4px;
        }

        /* =========================
           Source
           ========================= */

        .source-badge {
            display: inline-block;

            margin-top: 15px;

            padding:
                6px 14px;

            border-radius: 20px;

            font-size: 0.75rem;

            background:
                rgba(0, 242, 254, 0.1);

            color: #00f2fe;

            border:
                1px solid
                rgba(0, 242, 254, 0.3);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏎️ IoT Edge Speedometer</h1>

    <div class="subtitle">
        ESP32 Hardware Stream &bull;
        Kestrel Edge Web Server
    </div>


    <!-- =================================================

         ================================================= -->

        />

        <!-- โซนสีแดง -->

        <text

            fill="#778da9"

            text-anchor="middle"

        <!-- ค่าเปอร์เซ็นต์ตรงกลาง -->

            />

            <rect

                x="97"

                width="18"
                height="30"
                rx="3"
                fill="#22c55e"

            />

            <!-- LED 6 -->
            <rect

    </div>


    <!-- =================================================
         Statistics
         ================================================= -->

    <div class="stats-grid">

        <div class="stat-card">

            <div class="stat-label">
                ADC 12-Bit Raw
            </div>

            <div
                class="stat-val"
                id="disp-raw"

        <div class="stat-card">

    <!-- =================================================

         ================================================= -->

        class="source-badge"
        id="disp-source"

        Connecting to Server...
    </div>

</div>


<!-- =====================================================
     JavaScript
     ===================================================== -->

<script>

    // =================================================
    // แปลง Percentage เป็นมุมของเข็ม
    // 0%   = -90°
    // 50%  = 0°
    // 100% = 90°
    // =================================================

    function percentToAngle(pct) {

        return (pct / 100.0) * 180.0 - 90.0;

    }


    // =================================================
    // อัปเดต VU Meter
    // =================================================

    function updateVuMeter(percentage) {

        const leds =
            document.querySelectorAll(
                '#vumeter .led'
            );

        const totalLeds = leds.length;

        // ตัวอย่าง:
        // 0%   = 0 LEDs
        // 50%  = 5 LEDs
        // 100% = 10 LEDs

        const activeCount =
            Math.round(
                (percentage / 100.0)
                * totalLeds
            );


        leds.forEach((led, index) => {

            if (index < activeCount) {

                // เปิด LED
                led.style.opacity = '1.0';

                // Glow ตามสีของ LED
                const color =
                    led.getAttribute('fill');

                led.style.filter =
                    `drop-shadow(0 0 6px ${color})`;

            } else {

                // ปิด LED
                led.style.opacity = '0.15';

                led.style.filter = 'none';

            }

        });

    }


    // =================================================
    // ดึงข้อมูลจาก Kestrel
    // =================================================

    async function pollTelemetry() {

        try {

            const res =
                await fetch('/api/telemetry');

            if (!res.ok) {
                return;
            }


            const data =
                await res.json();


            // -----------------------------------------
            // แสดง Percentage
            // -----------------------------------------

            document
                .getElementById('disp-percent')
                .textContent =
                data.percentage.toFixed(1)
                + '%';


            // -----------------------------------------
            // แสดง Raw ADC
            // -----------------------------------------

            document
                .getElementById('disp-raw')
                .textContent =
                data.rawValue;


            // -----------------------------------------
            // แสดง Voltage
            // -----------------------------------------

            document
                .getElementById('disp-volt')
                .textContent =
                data.voltage.toFixed(2)
                + ' V';


            // -----------------------------------------
            // แสดง Data Source
            // -----------------------------------------

            document
                .getElementById('disp-source')
                .textContent =
                '📡 '
                + data.dataSource;


            // -----------------------------------------
            // หมุนเข็ม Speedometer
            // -----------------------------------------

            const angle =
                percentToAngle(
                    data.percentage
                );

            document
                .getElementById('needle')
                .style.transform =
                `rotate(${angle}deg)`;


            // -----------------------------------------
            // อัปเดต VU Meter
            // -----------------------------------------

            updateVuMeter(
                data.percentage
            );

        }

        catch (err) {

            console.error(
                'Polling error:',
                err
            );

        }

    }


    // =================================================
    // Poll ทุก 150 ms
    // =================================================

    setInterval(
        pollTelemetry,
        150
    );


    // เรียกครั้งแรกทันที
    pollTelemetry();

</script>

</body>
</html>
