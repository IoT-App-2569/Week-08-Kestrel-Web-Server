
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Edge Speedometer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at center, #1d2b40 0%, #111f32 75%);
            color: #f8fafc;
            font-family: Arial, Helvetica, sans-serif;
        }

        .dashboard {
            width: 505px;
            max-width: 100%;
            padding: 25px 21px 19px;
            background: #253145;
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 25px;
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            margin: 0;
            color: #00e5f5;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .header p {
            margin: 6px 0 0;
            color: #8fa4bc;
            font-size: 11px;
        }

        .visuals {
            display: grid;
            grid-template-columns: 125px minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            margin: 15px 0 17px;
        }

        .tank-panel {
            width: 100%;
            text-align: center;
        }

        #liquid-tank {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        #water-fill {
            transition: y 0.15s ease, height 0.15s ease;
        }

        .tank-percent {
            margin-top: -2px;
            color: #00e5f5;
            font-size: 17px;
            font-weight: 800;
            text-shadow: 0 0 12px rgba(0, 229, 245, 0.35);
        }

        .tank-caption {
            margin-top: 2px;
            color: #71859e;
            font-size: 9px;
        }

        .gauge-panel {
            min-width: 0;
        }

        #speedometer {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .gauge-label {
            fill: #7f93ac;
            font-size: 12px;
        }

        #gauge-value {
            fill: #ffffff;
            font-size: 31px;
            font-weight: 800;
            text-anchor: middle;
        }

        #needle {
            transition: transform 0.15s ease-out;
            filter: drop-shadow(0 0 5px rgba(255, 0, 85, 0.7));
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .metric-card {
            min-width: 0;
            padding: 15px 8px 13px;
            border-radius: 13px;
            background: #172638;
            text-align: center;
        }

        .metric-label {
            color: #91a5bd;
            font-size: 11px;
            font-weight: 700;
        }

        .metric-value {
            margin-top: 8px;
            color: #4dd8ff;
            font-size: 23px;
            font-weight: 800;
            overflow-wrap: anywhere;
            text-shadow: 0 0 12px rgba(77, 216, 255, 0.15);
        }

        .status-row {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }

        .status-pill {
            max-width: 100%;
            padding: 8px 17px;
            border: 1px solid rgba(0, 229, 245, 0.5);
            border-radius: 24px;
            background: rgba(0, 229, 245, 0.08);
            color: #00e5f5;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .status-pill.offline {
            border-color: #fb7185;
            color: #fda4af;
            background: rgba(251, 113, 133, 0.08);
        }

        .status-pill.simulation {
            border-color: #fbbf24;
            color: #fcd34d;
        }

        @media (max-width: 440px) {
            body {
                padding: 12px;
            }

            .dashboard {
                padding: 20px 12px 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .visuals {
                grid-template-columns: 100px minmax(0, 1fr);
                gap: 5px;
            }

            .metrics {
                gap: 9px;
            }

            .metric-value {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="dashboard">
        <header class="header">
            <h1>🏎️ IoT Edge Speedometer</h1>
            <p>ESP32 Hardware Stream • Kestrel Edge Web Server</p>
        </header>

        <section class="visuals">

            <!-- ถังแสดงระดับเซนเซอร์ -->
            <div class="tank-panel">
                <svg id="liquid-tank"
                     viewBox="0 0 180 220"
                     role="img"
                     aria-label="Sensor liquid level">

                    <defs>
                        <linearGradient id="water-grad"
                                        x1="0%" y1="0%"
                                        x2="0%" y2="100%">
                            <stop offset="0%"
                                  stop-color="#00f2fe"/>
                            <stop offset="100%"
                                  stop-color="#38aaff"/>
                        </linearGradient>

                        <filter id="water-glow"
                                x="-50%" y="-50%"
                                width="200%" height="200%">
                            <feGaussianBlur stdDeviation="5"
                                            result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>

                        <clipPath id="tank-shape">
                            <rect x="40" y="25"
                                  width="78" height="135"
                                  rx="17"/>
                        </clipPath>
                    </defs>

                    <rect x="40" y="25"
                          width="78" height="135"
                          rx="17"
                          fill="#07111f"
                          stroke="#087ca7"
                          stroke-width="3"/>

                    <g clip-path="url(#tank-shape)">
                        <rect id="water-fill"
                              x="40" y="160"
                              width="78" height="0"
                              fill="url(#water-grad)"
                              filter="url(#water-glow)"/>
                    </g>

                    <rect x="47" y="32"
                          width="6" height="120"
                          rx="3"
                          fill="#ffffff"
                          opacity="0.13"/>

                    <g font-family="Arial, sans-serif"
                       font-size="10"
                       fill="#8fa4bc">
                        <line x1="122" y1="25" x2="130" y2="25"
                              stroke="#71859e"/>
                        <text x="135" y="29">100%</text>

                        <line x1="122" y1="59" x2="130" y2="59"
                              stroke="#71859e"/>
                        <text x="135" y="63">75%</text>

                        <line x1="122" y1="92" x2="130" y2="92"
                              stroke="#71859e"/>
                        <text x="135" y="96">50%</text>

                        <line x1="122" y1="126" x2="130" y2="126"
                              stroke="#71859e"/>
                        <text x="135" y="130">25%</text>

                        <line x1="122" y1="160" x2="130" y2="160"
                              stroke="#71859e"/>
                        <text x="135" y="164">0%</text>
                    </g>
                </svg>

                <div id="tank-percent" class="tank-percent">0.0%</div>
                <div class="tank-caption">TANK LEVEL</div>
            </div>

            <!-- หน้าปัด Speedometer -->
            <div class="gauge-panel">
                <svg id="speedometer"
                     viewBox="0 0 520 310"
                     role="img"
                     aria-label="Sensor speedometer">

                    <!-- แถบสีของหน้าปัด -->
                    <path d="M 235 245 A 115 115 0 0 1 350 130"
                          fill="none"
                          stroke="#43e58c"
                          stroke-width="7"
                          stroke-linecap="round"/>

                    <path d="M 350 130 A 115 115 0 0 1 431.3 163.7"
                          fill="none"
                          stroke="#ffd21f"
                          stroke-width="7"/>

                    <path d="M 431.3 163.7 A 115 115 0 0 1 465 245"
                          fill="none"
                          stroke="#ff465f"
                          stroke-width="7"
                          stroke-linecap="round"/>

                    <!-- ตำแหน่ง 50% -->
                    <text x="350" y="112"
                          text-anchor="middle"
                          class="gauge-label">50%</text>

                    <text x="235" y="272"
                          text-anchor="middle"
                          class="gauge-label">0%</text>

                    <text x="465" y="272"
                          text-anchor="middle"
                          class="gauge-label">100%</text>

                    <!-- เข็มเริ่มต้นชี้ที่ 0% (ซ้ายสุด) -->
                    <g id="needle" transform="rotate(-90 350 245)">
                        <line x1="350" y1="245"
                              x2="350" y2="145"
                              stroke="#ff1764"
                              stroke-width="4"
                              stroke-linecap="round"/>

                        <circle cx="350" cy="245"
                                r="10"
                                fill="#ffffff"/>

                        <circle cx="350" cy="245"
                                r="5"
                                fill="#ff1764"/>
                    </g>

                    <!-- ตัวเลขเปอร์เซ็นต์ -->
                    <text id="gauge-value"
                          x="350" y="226">0.0%</text>
                </svg>
            </div>
        </section>

        <!-- ค่าเซนเซอร์ -->
        <section class="metrics">
            <div class="metric-card">
                <div class="metric-label">ADC 12-BIT RAW</div>
                <div id="disp-raw" class="metric-value">----</div>
            </div>

            <div class="metric-card">
                <div class="metric-label">SENSOR VOLTAGE</div>
                <div id="disp-volt" class="metric-value">--.-- V</div>
            </div>
        </section>

        <!-- สถานะการเชื่อมต่อ -->
        <div class="status-row">
            <div id="disp-source" class="status-pill">
                ⏳ Connecting to hardware...
            </div>
        </div>
    </main>

    <script>
        const needle = document.getElementById('needle');
        const gaugeValue = document.getElementById('gauge-value');
        const tankPercent = document.getElementById('tank-percent');
        const waterFill = document.getElementById('water-fill');
        const dispRaw = document.getElementById('disp-raw');
        const dispVolt = document.getElementById('disp-volt');
        const dispSource = document.getElementById('disp-source');

        // ป้องกันค่าที่อยู่นอกช่วง 0–100%
        function clampPercentage(value) {
            const number = Number(value);

            if (!Number.isFinite(number)) {
                return 0;
            }

            return Math.min(100, Math.max(0, number));
        }

        // อัปเดตเข็มและตัวเลข Speedometer
        function updateSpeedometer(percentage) {
            const pct = clampPercentage(percentage);

            // 0% = -90 องศา, 50% = 0 องศา,
            // 100% = 90 องศา
            const angle = (pct * 1.8) - 90;

            // ระบุจุดหมุนในพิกัด SVG โดยตรง เพื่อให้ปลาย 0% และ 100%
            // ตรงกับปลายซ้ายและขวาของหน้าปัดทุกขนาดหน้าจอ
            needle.setAttribute('transform', `rotate(${angle} 350 245)`);
            gaugeValue.textContent = `${pct.toFixed(1)}%`;
        }

        // อัปเดตระดับน้ำในถัง
        function updateTankLevel(percentage) {
            const pct = clampPercentage(percentage);
            const maxHeight = 135;
            const bottomY = 160;

            const height = (pct / 100) * maxHeight;
            const y = bottomY - height;

            waterFill.setAttribute('height', height);
            waterFill.setAttribute('y', y);

            tankPercent.textContent = `${pct.toFixed(1)}%`;
        }

        // อัปเดตข้อมูลทั้งหมดจาก API ของ Kestrel
        async function pollTelemetry() {
            try {
                const response = await fetch('/api/telemetry', {
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                const percentage = clampPercentage(data.percentage);

                updateSpeedometer(percentage);
                updateTankLevel(percentage);

                dispRaw.textContent =
                    data.rawValue ?? '----';

                const voltage = Number(data.voltage);

                dispVolt.textContent = Number.isFinite(voltage)
                    ? `${voltage.toFixed(2)} V`
                    : '--.-- V';

                // ใช้ชื่อแหล่งข้อมูลที่ API ส่งมา
                const source = String(data.dataSource ?? 'Unknown');
                const isSimulation = /simulation/i.test(source);
                const isLive = /live|hardware|COM\d+|usbserial/i.test(source);

                dispSource.classList.remove('offline', 'simulation');

                if (isSimulation) {
                    dispSource.classList.add('simulation');
                    dispSource.textContent = `⚠️ Simulation (${source})`;
                } else if (isLive) {
                    dispSource.textContent = `📡 Live Hardware (${source})`;
                } else {
                    dispSource.textContent = `📡 ${source}`;
                }

            } catch (error) {
                console.error('Telemetry polling error:', error);

                dispSource.textContent = '⚠️ API Disconnected';
                dispSource.classList.add('offline');
            }
        }

        // โหลดค่าทันที และอัปเดตซ้ำทุก 150 ms
        pollTelemetry();
        setInterval(pollTelemetry, 150);
    </script>
</body>
</html>
