
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-Channel IoT Command Center</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #07111f;
            --panel: #101e30;
            --cyan: #38e8ff;
            --green: #42ff9e;
            --yellow: #ffd447;
            --red: #ff5364;
            --text: #eaf5ff;
            --muted: #8fa8c2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 20px 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(ellipse at 50% 0%, #102944 0, #07111f 62%);
            color: var(--text);
        }

        header {
            max-width: 1200px;
            margin: 0 auto 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
            color: var(--cyan);
            letter-spacing: 1px;
            font-size: clamp(1.4rem, 4vw, 2.65rem);
            text-shadow: 0 0 16px #38e8ff55;
        }

        .student-badge, .live-status {
            display: inline-block;
            border-radius: 24px;
            font-weight: 700;
        }

        .student-badge {
            margin: 4px 0 12px;
            padding: 9px 20px;
            border: 1px solid #087b91;
            color: var(--cyan);
            letter-spacing: 1px;
            background: #0b2436;
        }

        .live-status {
            margin-top: 14px;
            padding: 9px 20px;
            color: #d6e9fa;
            background: #1b2c41;
            border: 1px solid #2a4058;
        }

        header p {
            color: var(--muted);
            margin: 0;
        }

        .status-bar {
            max-width: 1100px;
            margin: 0 auto 20px;
            padding: 12px 16px;
            border: 1px solid #28445f;
            border-radius: 12px;
            background: #0b1929;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.9rem;
        }

        .status-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--yellow);
            margin-right: 7px;
        }

        .status-dot.online {
            background: var(--green);
            box-shadow: 0 0 10px var(--green);
        }

        .status-dot.offline {
            background: var(--red);
        }

        .dashboard {
            max-width: 1125px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .panel {
            min-width: 0;
            min-height: 470px;
            padding: 28px 30px;
            background: linear-gradient(145deg, #0e2037, #091629);
            border: 1px solid #07516a;
            border-radius: 24px;
            box-shadow: 0 12px 40px #0004;
        }

        .panel h2 {
            margin: 0 0 28px;
            font-size: 1.2rem;
            color: #c7d9ea;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 18px;
        }

        .channel-label {
            color: var(--cyan);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        /* Retro 7-segment digital gauge */
        .digital-display {
            min-height: 180px;
            padding: 22px 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: #030b14;
            border: 2px solid #203a52;
            border-radius: 18px;
            box-shadow: inset 0 0 22px #000, 0 0 24px #38e8ff12;
        }

        .digit {
            position: relative;
            width: clamp(42px, 8vw, 70px);
            height: clamp(78px, 14vw, 118px);
        }

        .seg {
            position: absolute;
            background: #15312c;
            opacity: 0.35;
            border-radius: 5px;
            transition: background 0.2s, opacity 0.2s, box-shadow 0.2s;
        }

        .seg.on {
            background: var(--green);
            opacity: 1;
            box-shadow: 0 0 8px #42ff9e, 0 0 18px #42ff9e88;
        }

        .seg.a, .seg.g, .seg.d {
            width: 64%;
            height: 8%;
            left: 18%;
            clip-path: polygon(12% 0, 88% 0, 100% 50%, 88% 100%, 12% 100%, 0 50%);
        }

        .seg.a { top: 0; }
        .seg.g { top: 46%; }
        .seg.d { bottom: 0; }

        .seg.f, .seg.b, .seg.e, .seg.c {
            width: 13%;
            height: 38%;
            clip-path: polygon(0 10%, 50% 0, 100% 10%, 100% 90%, 50% 100%, 0 90%);
        }

        .seg.f { left: 7%; top: 5%; }
        .seg.b { right: 7%; top: 5%; }
        .seg.e { left: 7%; bottom: 5%; }
        .seg.c { right: 7%; bottom: 5%; }

        .percent-symbol {
            color: var(--green);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            text-shadow: 0 0 12px #42ff9e;
            margin-left: 4px;
        }

        .digital-caption {
            margin: 52px 0 0;
            color: var(--green);
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            text-shadow: 0 0 12px #38e8ff;
        }

        .tank-wrap {
            display: flex;
            min-height: 315px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .tank {
            width: 190px;
            max-height: 245px;
            overflow: visible;
        }

        #waterFill {
            transition: y 0.25s ease, height 0.25s ease;
        }

        .tank-value {
            margin-top: 6px;
            color: var(--cyan);
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 0 0 12px #38e8ff;
        }

        .tank-caption {
            margin-top: 2px;
            fill: var(--muted);
            color: var(--muted);
            font-size: 0.8rem;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            display: none;
        }

        .metric {
            background: #081523;
            border: 1px solid #243e55;
            border-radius: 10px;
            padding: 12px;
        }

        .metric-label {
            color: var(--muted);
            font-size: 0.78rem;
        }

        .metric-value {
            margin-top: 5px;
            font-size: 1.25rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        footer {
            max-width: 1125px;
            margin: 22px auto 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
        }

        @media (max-width: 700px) {
            body { padding: 14px; }
            .dashboard { grid-template-columns: 1fr; }
            .panel { padding: 17px; }
            .digital-display { min-height: 150px; }
            .digital-caption { margin-top: 30px; }
        }
    </style>
</head>

<body>
    <header>
        <h1>🎛️ DUAL-CHANNEL IoT COMMAND CENTER</h1>
        <div class="student-badge">Student ID: 67030002</div>
        <p>ESP32 Dual Hardware ADC Stream · Kestrel Edge Web Server</p>
        <div class="live-status" id="connectionStatus">กำลังเชื่อมต่อ API...</div>
    </header>

    <main class="dashboard">
        <!-- Channel A: Retro 7-Segment -->
        <section class="panel">
            <h2>CH-A: RETRO 7-SEGMENT</h2>

            <div class="digital-display">
                <div class="digit" id="digitTens">
                    <span class="seg a"></span>
                    <span class="seg b"></span>
                    <span class="seg c"></span>
                    <span class="seg d"></span>
                    <span class="seg e"></span>
                    <span class="seg f"></span>
                    <span class="seg g"></span>
                </div>
                <div class="digit" id="digitOnes">
                    <span class="seg a"></span>
                    <span class="seg b"></span>
                    <span class="seg c"></span>
                    <span class="seg d"></span>
                    <span class="seg e"></span>
                    <span class="seg f"></span>
                    <span class="seg g"></span>
                </div>
                <span class="percent-symbol">%</span>
            </div>

            <div class="digital-caption" id="valueA">0.0%</div>
        </section>

        <!-- Channel B: Analog Speedometer -->
        <section class="panel">
            <h2>CH-B: SENSOR B (HARDWARE ADC)</h2>
            <div class="tank-wrap">
                <svg class="tank" viewBox="0 0 180 250" role="img" aria-label="Sensor B tank level">
                    <defs>
                        <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#00f2fe"/>
                            <stop offset="100%" stop-color="#38aaff"/>
                        </linearGradient>
                        <clipPath id="tankClip">
                            <rect x="35" y="18" width="86" height="166" rx="20"/>
                        </clipPath>
                        <filter id="waterGlow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="4" result="blur"/>
                            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <rect x="35" y="18" width="86" height="166" rx="20"
                          fill="#06111f" stroke="#1689b2" stroke-width="3"/>
                    <g clip-path="url(#tankClip)">
                        <rect id="waterFill" x="35" y="184" width="86" height="0"
                              fill="url(#waterGradient)" filter="url(#waterGlow)"/>
                    </g>
                    <rect x="43" y="26" width="6" height="150" rx="3" fill="#fff" opacity=".14"/>
                    <g font-family="Arial, sans-serif" font-size="11" fill="#9bb0c5">
                        <path d="M127 18h10 M127 59.5h8 M127 101h10 M127 142.5h8 M127 184h10"
                              stroke="#7890a8"/>
                        <text x="143" y="22">100%</text>
                        <text x="143" y="63">75%</text>
                        <text x="143" y="105">50%</text>
                        <text x="143" y="146">25%</text>
                        <text x="143" y="188">0%</text>
                    </g>
                </svg>
                <div class="tank-value" id="valueB">0.0%</div>
                <div class="tank-caption">TANK LEVEL</div>
            </div>
        </section>
    </main>

    <footer>
        ID 67030002 · Live Dual Hardware · Kestrel Edge Web Server
    </footer>

    <script>
        // 7-segment patterns: a, b, c, d, e, f, g
        const digitPatterns = {
            0: ["a", "b", "c", "d", "e", "f"],
            1: ["b", "c"],
            2: ["a", "b", "d", "e", "g"],
            3: ["a", "b", "c", "d", "g"],
            4: ["b", "c", "f", "g"],
            5: ["a", "c", "d", "f", "g"],
            6: ["a", "c", "d", "e", "f", "g"],
            7: ["a", "b", "c"],
            8: ["a", "b", "c", "d", "e", "f", "g"],
            9: ["a", "b", "c", "d", "f", "g"]
        };

        function setDigit(elementId, digit) {
            const element = document.getElementById(elementId);
            const activeSegments = digitPatterns[digit] || [];

            element.querySelectorAll(".seg").forEach(segment => {
                const segmentName = [...segment.classList]
                    .find(name => name.length === 1 &&
                        "abcdefg".includes(name));

                segment.classList.toggle(
                    "on",
                    activeSegments.includes(segmentName)
                );
            });
        }

        function updateDigitalGauge(percentage) {
            const value = Math.max(0, Math.min(99,
                Math.round(percentage)));
            const tens = Math.floor(value / 10);
            const ones = value % 10;

            setDigit("digitTens", tens);
            setDigit("digitOnes", ones);
        }

        function updateTankLevel(percentage) {
            const value = Number.isFinite(Number(percentage))
                ? Math.max(0, Math.min(100, Number(percentage)))
                : 0;
            const maxHeight = 166;
            const bottom = 184;
            const height = maxHeight * value / 100;
            const fill = document.getElementById("waterFill");
            fill.setAttribute("height", height);
            fill.setAttribute("y", bottom - height);
            document.getElementById("valueB").textContent =
                `${value.toFixed(1)}%`;
        }

        async function fetchTelemetry() {
            const status = document.getElementById("connectionStatus");

            try {
                const response = await fetch("/api/telemetry",
                    { cache: "no-store" });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                const percentageA = Number(data.channelA?.percentage ?? 0);
                const percentageB = Number(data.channelB?.percentage ?? 0);
                updateDigitalGauge(percentageA);
                updateTankLevel(percentageB);
                document.getElementById("valueA").textContent =
                    `${percentageA.toFixed(1)}%`;
                const source = data.dataSource ?? "Live Dual Hardware";
                status.textContent = `ID 67030002 | ${source}`;

            } catch (error) {
                status.textContent = `API Disconnected: ${error.message}`;
                status.style.borderColor = "#ff5364";
                status.style.color = "#ff9da8";
            }
        }

        fetchTelemetry();
        setInterval(fetchTelemetry, 500);
    </script>
</body>
</html>
