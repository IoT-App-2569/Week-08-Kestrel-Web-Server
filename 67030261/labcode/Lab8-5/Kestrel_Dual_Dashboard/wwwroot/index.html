<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-Channel IoT Dashboard</title>
    <style>
        :root {
            --bg: #0a0f1d;
            --card: rgba(16, 24, 40, 0.75);
            --border: rgba(56, 189, 248, 0.2);
            --cyan: #00f2fe;
            --green: #00ffcc;
        }
        body {
            background: radial-gradient(circle at 50% 15%, #132238 0%, var(--bg) 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }
        /* CSS Grid วาง 2 คอลัมน์ รองรับ Responsive บนมือถือ */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 900px;
        }
        .widget-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .needle { transition: transform 0.12s cubic-bezier(0.1, 0.8, 0.3, 1); transform-origin: 100px 100px; }
        .led { transition: opacity 0.1s ease, filter 0.1s ease; }
        .seg { fill: #1e293b; opacity: 0.15; transition: opacity 0.08s ease; }
        .seg.active { fill: var(--green); opacity: 1; filter: drop-shadow(0 0 6px var(--green)); }
        #water-fill { transition: y 0.15s ease-out, height 0.15s ease-out; }
    </style>
</head>
<body>
    <h1> Dual-Channel IoT Command Center</h1>
    <h1>  67030261 </h1>
    <p style="color: #94a3b8; margin-bottom: 20px;">ESP32 Hardware Stream &bull; Kestrel Edge Web Server</p>

    <div class="dashboard-grid">
        <!-- การ์ดฝั่งซ้าย: Potentiometer (GPIO 34) -->
        <div class="widget-card" id="card-left">
            <h3 id="title-left"> Potentiometer (GPIO 34)</h3>
            <div id="container-left">
                <!-- หน้าปัดวัดความเร็วแบบ SVG แท้ 100% -->
                <svg class="gauge-svg" viewBox="0 0 300 200" style="width:100%; max-width:280px; filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.2));">
                    <!-- รางมาตรวัดพื้นหลัง (สีเทาจาง) -->
                    <path d="M 40 150 A 110 110 0 0 1 260 150" fill="none" stroke="#2a3b5c" stroke-width="18" stroke-linecap="round"/>

                    <!-- รางโซนสีเตือน (เขียว - เหลือง - แดง) -->
                    <path d="M 40 150 A 110 110 0 0 1 150 40" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/>
                    <path d="M 150 40 A 110 110 0 0 1 215 65" fill="none" stroke="#facc15" stroke-width="6"/>
                    <path d="M 215 65 A 110 110 0 0 1 260 150" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>

                    <!-- ขีดตัวเลขสเกล -->
                    <text x="35" y="175" fill="#778da9" font-size="12" text-anchor="middle">0%</text>
                    <text x="150" y="25" fill="#778da9" font-size="12" text-anchor="middle">50%</text>
                    <text x="265" y="175" fill="#778da9" font-size="12" text-anchor="middle">100%</text>

                    <!-- เข็มไมล์สีแดงสะท้อนแสง (หมุนรอบจุด 150, 150) -->
                    <g id="needle-left" class="needle" style="transform-origin: 150px 150px; transform: rotate(-90deg);">
                        <!-- ตัวเข็มทรงสามเหลี่ยมเรียว -->
                        <polygon points="147,150 153,150 151,50 149,50" fill="#ff0055" filter="drop-shadow(0 0 6px #ff0055)"/>
                        <!-- ฝาครอบแกนหมุนตรงกลาง -->
                        <circle cx="150" cy="150" r="10" fill="#ffffff"/>
                        <circle cx="150" cy="150" r="5" fill="#ff0055"/>
                    </g>
                </svg>
            </div>
            <p id="val-left" style="font-size: 1.5rem; font-weight: bold; color: var(--cyan);">0.0%</p>
        </div>

        <!-- การ์ดฝั่งขวา: LDR (GPIO 35) -->
        <div class="widget-card" id="card-right">
            <h3 id="title-right"> LDR (GPIO 35)</h3>
            <div id="container-right">
                <!-- แถบหลอดไฟ LED นีออน 10 ดวง (เขียว 6 / เหลือง 2 / แดง 2) -->
                <svg width="250" height="40" viewBox="0 0 250 40" id="vumeter-right">
                    <rect class="led" x="5" y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.2"/>
                    <rect class="led" x="28" y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.2"/>
                    <rect class="led" x="51" y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.2"/>
                    <rect class="led" x="74" y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.2"/>
                    <rect class="led" x="97" y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.2"/>
                    <rect class="led" x="120" y="5" width="18" height="30" rx="3" fill="#22c55e" opacity="0.2"/>
                    <rect class="led" x="143" y="5" width="18" height="30" rx="3" fill="#eab308" opacity="0.2"/>
                    <rect class="led" x="166" y="5" width="18" height="30" rx="3" fill="#eab308" opacity="0.2"/>
                    <rect class="led" x="189" y="5" width="18" height="30" rx="3" fill="#ef4444" opacity="0.2"/>
                    <rect class="led" x="212" y="5" width="18" height="30" rx="3" fill="#ef4444" opacity="0.2"/>
                </svg>
            </div>
            <p id="val-right" style="font-size: 1.5rem; font-weight: bold; color: var(--cyan);">0.0%</p>
        </div>
    </div>

    <script>
        // ฟังก์ชันคำนวณแปลงสเกลเชิงเส้น (Linear Mapping)
        // แปลง 0% - 100% เป็นมุมองศา -90deg ถึง +90deg
        function percentToAngle(pct) {
            return (pct / 100.0) * 180.0 - 90.0;
        }

        // อัปเดตฝั่งซ้าย: Analog Speedometer (GPIO 34)
        function updateLeftWidget(percentage) {
            const needle = document.getElementById('needle-left');
            if (needle) {
                const angle = percentToAngle(percentage);
                needle.style.transform = `rotate(${angle}deg)`;
            }
            const val = document.getElementById('val-left');
            if (val) val.textContent = percentage.toFixed(1) + '%';
        }

        // อัปเดตฝั่งขวา: Audio VU Meter (GPIO 35)
        function updateRightWidget(percentage) {
            const leds = document.querySelectorAll('#container-right .led');
            const totalLeds = leds.length; // มี 10 หลอด

            // คำนวณจำนวนหลอดที่ต้องเปิด (0 ถึง 10 หลอด)
            const activeCount = Math.round((percentage / 100.0) * totalLeds);

            leds.forEach((led, index) => {
                if (index < activeCount) {
                    // หลอดที่เปิด: ปรับความสว่างเต็มที่ พร้อมใส่แสงนีออนเรืองแสงตามสีเดิมของหลอด
                    led.style.opacity = '1.0';
                    const color = led.getAttribute('fill');
                    led.style.filter = `drop-shadow(0 0 6px ${color})`;
                } else {
                    // หลอดที่ปิด: ปรับให้หรี่มืดลง
                    led.style.opacity = '0.15';
                    led.style.filter = 'none';
                }
            });

            const val = document.getElementById('val-right');
            if (val) val.textContent = percentage.toFixed(1) + '%';
        }

        async function pollTelemetry() {
            try {
                const res = await fetch('/api/telemetry');
                if (!res.ok) return;
                const data = await res.json();

                // 1. อัปเดตเกจ์ฝั่งซ้าย ด้วย data.channelA.percentage
                updateLeftWidget(data.channelA.percentage);

                // 2. อัปเดตเกจ์ฝั่งขวา ด้วย data.channelB.percentage
                updateRightWidget(data.channelB.percentage);

            } catch (err) {
                console.error(err);
            }
        }
        setInterval(pollTelemetry, 150);
    </script>
</body>
</html>
